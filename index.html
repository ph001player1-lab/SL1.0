<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Социальная лотерея</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --ink:#060D0A; --felt:#0D1A14; --raise:#122A1F; --edge:#1C3227;
  --mint:#4ADE80; --gold:#E5B84B; --chalk:#E9F3EC; --dim:#7C9A8A;
  --display:'Anton','Haettenschweiler','Arial Narrow',sans-serif;
  --ui:'Space Grotesk',-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--chalk);font-family:var(--ui);
  overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body{padding:0 16px calc(24px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}

.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.screen{display:none;animation:fade .28s ease both}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ─── билет ─── */
.ticket{background:var(--felt);border:1px solid var(--edge);border-radius:18px;margin-top:14px;overflow:hidden}
.ticket-head{display:flex;justify-content:space-between;align-items:baseline;padding:16px 18px 12px}
.ticket-head b{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--gold)}
.perf{height:1px;background:repeating-linear-gradient(90deg,var(--edge) 0 6px,transparent 6px 12px);
  position:relative}
.perf::before,.perf::after{content:'';position:absolute;top:-7px;width:14px;height:14px;
  border-radius:50%;background:var(--ink)}
.perf::before{left:-8px} .perf::after{right:-8px}

.qr-wrap{padding:22px 18px 14px;text-align:center}
.qr-box{width:min(62vw,230px);margin:0 auto;background:var(--chalk);border-radius:12px;padding:10px;
  box-shadow:0 0 0 6px rgba(74,222,128,.07)}
.qr-box svg{display:block}
.qr-cap{margin-top:12px;font-size:13px;color:var(--dim)}

.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--edge);
  border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}
.cell{background:var(--felt);padding:11px 8px;text-align:center;min-height:64px;
  display:flex;flex-direction:column;justify-content:center;gap:3px}
.cell .ic{font-size:17px;line-height:1}
.cell .vl{font-size:10px;line-height:1.25;color:var(--chalk);font-weight:500}
.edit{width:100%;background:none;border:0;color:var(--dim);font-family:var(--mono);font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;padding:13px;cursor:pointer}
.edit:active{color:var(--mint)}

/* ─── зал ─── */
.hall{margin-top:14px;background:var(--felt);border:1px solid var(--edge);border-radius:18px;padding:18px}
.hall-top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:4px}
.big{font-family:var(--display);font-size:60px;line-height:.82;letter-spacing:-.01em}
.big.gold{color:var(--gold)}
.hall-sub{font-size:13px;color:var(--dim);margin-bottom:16px}

.bars{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.bar{display:grid;grid-template-columns:44px 1fr 26px;align-items:center;gap:9px}
.bar .lb{font-family:var(--mono);font-size:11px;color:var(--dim)}
.bar .tr{height:9px;background:var(--raise);border-radius:5px;overflow:hidden}
.bar .fl{height:100%;background:var(--mint);border-radius:5px;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar .ct{font-family:var(--mono);font-size:12px;text-align:right;color:var(--chalk)}
.bar.jack .lb,.bar.jack .ct{color:var(--gold);font-weight:700}
.bar.jack .fl{background:var(--gold)}
.bar.zero{opacity:.32}

.note{margin-top:14px;font-size:12px;color:var(--dim);line-height:1.5}
.waiting{text-align:center;padding:22px 8px;color:var(--dim);font-size:14px;line-height:1.6}

/* ─── прогресс охоты ─── */
.hunt{margin-top:14px;display:flex;align-items:center;gap:12px;
  background:var(--felt);border:1px solid var(--edge);border-radius:14px;padding:14px 16px}
.hunt .tr{flex:1;height:6px;background:var(--raise);border-radius:3px;overflow:hidden}
.hunt .fl{height:100%;background:var(--mint);width:0;transition:width .6s ease}
.hunt span{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap}

/* ─── кнопки ─── */
.btn{display:block;width:100%;border:0;border-radius:14px;padding:18px;cursor:pointer;
  font-family:var(--ui);font-size:16px;font-weight:700;letter-spacing:.02em;
  background:var(--mint);color:#04150C;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.985);filter:brightness(.93)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--edge);font-weight:500;font-size:14px}
.sticky{position:sticky;bottom:0;padding:14px 0 calc(6px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,var(--ink) 26%);margin-top:16px}

/* ─── опрос ─── */
.q-top{padding:22px 2px 4px}
.q-rail{height:3px;background:var(--raise);border-radius:2px;margin:10px 0 26px;overflow:hidden}
.q-rail i{display:block;height:100%;background:var(--mint);border-radius:2px;transition:width .4s ease}
h1{font-size:27px;line-height:1.12;margin:0 0 8px;font-weight:700;letter-spacing:-.02em}
.q-hint{font-size:14px;color:var(--dim);line-height:1.5;margin:0 0 20px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{background:var(--felt);border:1px solid var(--edge);border-radius:14px;padding:15px 17px;
  cursor:pointer;transition:border-color .15s,background .15s}
.opt:active{background:var(--raise)}
.opt.pick{border-color:var(--mint);background:rgba(74,222,128,.09)}
.opt .t{font-size:16px;font-weight:500}
.opt .d{font-size:12.5px;color:var(--dim);margin-top:4px;line-height:1.45}
.opt.pick .t{color:var(--mint)}

/* ─── результат скана ─── */
.res{position:fixed;inset:0;background:var(--ink);z-index:40;display:none;
  padding:0 20px calc(24px + env(safe-area-inset-bottom));overflow-y:auto}
.res.on{display:block;animation:fade .25s ease both}
.res-in{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:40px 0}
.score{font-family:var(--display);font-size:96px;line-height:.85;text-align:center;color:var(--mint)}
.score.jackpot{color:var(--gold)}
.score-of{text-align:center;font-family:var(--mono);font-size:13px;letter-spacing:.22em;color:var(--dim);margin-top:10px}
.who{text-align:center;font-size:19px;font-weight:700;margin:22px 0 4px}
.who small{display:block;font-family:var(--mono);font-size:12px;color:var(--dim);font-weight:400;margin-top:3px}
.axes{display:flex;flex-direction:column;gap:1px;background:var(--edge);border:1px solid var(--edge);
  border-radius:14px;overflow:hidden;margin:26px 0}
.ax{background:var(--felt);padding:12px 15px;display:flex;align-items:center;gap:11px;font-size:13.5px}
.ax .ic{font-size:15px;width:20px;text-align:center;flex:none}
.ax.hit{background:rgba(74,222,128,.08)}
.ax.hit .tx{color:var(--chalk)}
.ax .tx{color:#4C6659;flex:1;line-height:1.35}
.ax .mk{font-family:var(--mono);font-size:12px;color:var(--mint)}
.ax .mk.no{color:#2E4739}

/* ─── админ ─── */
.adm{margin-top:16px}
.adm h2{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold);margin:26px 0 10px}
.fld{width:100%;background:var(--felt);border:1px solid var(--edge);border-radius:12px;padding:14px;
  color:var(--chalk);font-family:var(--ui);font-size:15px;margin-bottom:9px}
.fld:focus{outline:none;border-color:var(--mint)}
.kv{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--edge);font-size:14px}
.kv b{font-family:var(--mono);color:var(--mint)}
.evt{background:var(--felt);border:1px solid var(--edge);border-radius:14px;padding:15px;margin-bottom:9px}
.evt .n{font-weight:700;font-size:15px}
.evt .c{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.12em;margin-top:3px}
.poster{background:var(--chalk);color:#0A0A0A;border-radius:14px;padding:22px;text-align:center;margin:12px 0}
.poster .pt{font-family:var(--display);font-size:23px;line-height:1;letter-spacing:.01em}
.poster .ps{font-family:var(--mono);font-size:10px;letter-spacing:.2em;margin:7px 0 15px;color:#4A5A50}
.poster .pq{width:min(64%,220px);margin:0 auto}
.poster .pc{font-family:var(--mono);font-size:15px;letter-spacing:.28em;margin-top:14px;font-weight:700}
.poster .pf{font-size:11px;color:#5A6A60;margin-top:7px;line-height:1.4}
.pairs{font-family:var(--mono);font-size:12.5px;line-height:2}
.pairs i{color:var(--gold);font-style:normal}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);
  background:var(--raise);border:1px solid var(--edge);color:var(--chalk);padding:12px 20px;
  border-radius:11px;font-size:14px;z-index:60;transition:transform .3s cubic-bezier(.2,.8,.2,1);
  max-width:88vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ЗАГРУЗКА -->
<div class="screen on" id="s-load">
  <div class="waiting" style="padding-top:44vh">Открываем лотерею…</div>
</div>

<!-- ОПРОС -->
<div class="screen" id="s-quiz">
  <div class="q-top">
    <div class="eyebrow" id="q-step">Вопрос 1 из 6</div>
    <div class="q-rail"><i id="q-fill" style="width:16.6%"></i></div>
  </div>
  <h1 id="q-title"></h1>
  <p class="q-hint" id="q-hint"></p>
  <div class="opts" id="q-opts"></div>
  <div class="sticky">
    <button class="btn" id="q-next" disabled>Дальше</button>
    <button class="btn ghost" id="q-back" style="margin-top:8px;display:none">Назад</button>
  </div>
</div>

<!-- БИЛЕТ -->
<div class="screen" id="s-ticket">
  <div class="ticket">
    <div class="ticket-head">
      <span class="eyebrow" id="t-event">Игра</span>
      <b id="t-serial">№ 0000</b>
    </div>
    <div class="perf"></div>
    <div class="qr-wrap">
      <div class="qr-box" id="t-qr"></div>
      <div class="qr-cap">Дай себя отсканировать</div>
    </div>
    <div class="cells" id="t-cells"></div>
    <button class="edit" id="t-edit">Изменить ответы</button>
  </div>

  <div class="hall" id="t-hall"></div>

  <div class="hunt">
    <span id="h-txt">0 из 0</span>
    <div class="tr"><i class="fl" id="h-fill"></i></div>
    <span>отсканировано</span>
  </div>

  <div class="sticky">
    <button class="btn" id="t-scan">Сканировать</button>
    <button class="btn ghost" id="t-admin" style="margin-top:8px;display:none">Панель организатора</button>
  </div>
</div>

<!-- АДМИН -->
<div class="screen" id="s-admin">
  <div class="adm">
    <div class="q-top"><div class="eyebrow">Панель организатора</div></div>
    <h2>Новая игра</h2>
    <input class="fld" id="a-title" placeholder="Название, например «Пятница на Банзаане»">
    <input class="fld" id="a-date" type="date">
    <button class="btn" id="a-create">Создать игру</button>
    <div id="a-body"></div>
    <div class="sticky"><button class="btn ghost" id="a-back">Закрыть панель</button></div>
  </div>
</div>

<!-- РЕЗУЛЬТАТ СКАНА -->
<div class="res" id="s-res"><div class="res-in">
  <div class="score" id="r-score">0</div>
  <div class="score-of" id="r-of">ИЗ ШЕСТИ</div>
  <div class="who" id="r-who"></div>
  <div class="axes" id="r-axes"></div>
  <button class="btn" id="r-write">Написать в Telegram</button>
  <button class="btn ghost" id="r-more" style="margin-top:8px">Сканировать ещё</button>
  <button class="btn ghost" id="r-close" style="margin-top:8px">Закрыть</button>
</div></div>

<div class="toast" id="toast"></div>

<script src="qr.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════
   НАСТРОЙКА — заполнить после развёртывания Apps Script
   ══════════════════════════════════════════════════════════════ */
const API = 'https://script.google.com/macros/s/AKfycbw0wFaA65onMfD15mst7I6SiF3_vFGneqAE92k2nYZewxH2o8dDKRT7dAPB1XtpAkE_hw/exec';
const BOT = 'love_lottery_1_bot';          // без @
const BOARD_URL = location.origin + location.pathname.replace(/index\.html$/,'') + 'board.html';

/* ─── шесть сфер ─── */
const AXES = [
  { ic:'🌴', key:'Климат', q:'Где тебе комфортно жить?',
    hint:'Не где живёшь сейчас, а где хочется. Совпадение значит, что вы оба останетесь в одном месте.',
    gain:'Оба остаётесь в одном климате',
    opts:[['Тропический','Круглый год тепло, +24…+35'],['Субтропический','Жаркое лето, мягкая зима'],
          ['Умеренный','Четыре выраженных времени года'],['Холодный','Долгая зима, короткое лето'],
          ['Полярный','Большую часть года ниже нуля']] },
  { ic:'❤️', key:'Отношения', q:'Какая модель отношений тебе близка?',
    hint:'Как ты живёшь сейчас или хочешь жить. Правильных ответов нет и оценок тоже.',
    gain:'Одинаково понимаете, что такое «вместе»',
    opts:[['Моногамия','Один партнёр, взаимная исключительность'],['Полиамория','Несколько близких связей по согласию всех'],
          ['Свободные отношения','Без обязательств об исключительности'],['Асексуальный образ жизни','Близость без сексуальной составляющей']] },
  { ic:'🏠', key:'Быт', q:'Какой уклад у твоей повседневности?',
    hint:'Как устроен твой обычный день и с кем ты его делишь.',
    gain:'Совпал уклад дня — соседство, общий дом',
    opts:[['Одиночное проживание','Своё пространство, никого рядом постоянно'],['Патриархальная семья','Решения и ответственность за мужчиной'],
          ['Матриархальная семья','Решения и ответственность за женщиной'],['Партнёрская семья','Равный вклад и общие решения'],
          ['Коммуна','Несколько человек, общий быт и ресурсы'],['Гостевой брак','Вместе, но живём раздельно']] },
  { ic:'⚖️', key:'Общество', q:'Какие общественные порядки тебе по душе?',
    hint:'Как, по-твоему, должно быть устроено общество вокруг.',
    gain:'Общие взгляды — легко дружить и спорить',
    opts:[['Либерализм','Максимум личной свободы, минимум государства'],['Социализм','Государство выравнивает возможности'],
          ['Консерватизм','Опора на традицию и устоявшийся порядок'],['Коммунизм','Общая собственность, распределение по нуждам'],
          ['Анархизм','Самоорганизация без принуждающей власти'],['Авторитаризм','Сильная вертикаль и жёсткий порядок']] },
  { ic:'💰', key:'Деньги', q:'Как ты зарабатываешь?',
    hint:'Твой основной способ дохода сегодня. Совпадение — это готовый партнёр по проекту.',
    gain:'Готовый партнёр по проекту или бизнесу',
    opts:[['Предприниматель','Своё дело, доход от него'],['Наёмный работник','Зарплата, работа по найму'],
          ['Инвестор','Доход с вложенного капитала'],['Фрилансер','Проекты, заказчики, свободный график'],
          ['Кооперативная экономика','Общее дело с равными долями'],['Безусловный базовый доход','Гарантированный доход, дальше сам решаю']] },
  { ic:'🧭', key:'Мировоззрение', q:'Во что ты веришь?',
    hint:'Твой культурный код. Совпадение — общий круг и общая практика.',
    gain:'Общая практика и общий круг',
    opts:[['Христианство',''],['Ислам',''],['Буддизм',''],['Иудаизм',''],
          ['Научный материализм','Мир объясним через науку'],['Агностицизм','Достоверно знать нельзя'],['Эзотерика','Скрытые связи и практики']] }
];

/* ─── каркас ─── */
const tg = window.Telegram?.WebApp;
const $  = s => document.querySelector(s);
const S  = { user:null, event:null, answers:[], state:null, admin:false, editing:false };
let qi = 0, draft = [];

function show(id){ document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on')); $(id).classList.add('on'); window.scrollTo(0,0); }
function toast(t, ms){ const el=$('#toast'); el.textContent=t; el.classList.add('on');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'), ms||2600); }
function haptic(k){ try{ k==='ok' ? tg.HapticFeedback.notificationOccurred('success')
                        : tg.HapticFeedback.impactOccurred('light'); }catch(e){} }

async function api(action, data){
  const body = JSON.stringify(Object.assign({ action, initData: tg?.initData || '' }, data||{}));
  const r = await fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

/* ─── офлайн-очередь сканов ─── */
const Q = {
  key:'sl_queue',
  all(){ try{ return JSON.parse(localStorage.getItem(Q.key)||'[]'); }catch(e){ return []; } },
  add(x){ const a=Q.all(); a.push(x); localStorage.setItem(Q.key, JSON.stringify(a)); },
  async flush(){
    const a = Q.all(); if(!a.length) return;
    const left = [];
    for (const item of a){ try{ await api('scan', item); }catch(e){ left.push(item); } }
    localStorage.setItem(Q.key, JSON.stringify(left));
    if (a.length && !left.length) refresh();
  }
};

/* ─── опрос ─── */
function renderQ(){
  const a = AXES[qi];
  $('#q-step').textContent = 'Вопрос ' + (qi+1) + ' из 6';
  $('#q-fill').style.width = ((qi+1)/6*100) + '%';
  $('#q-title').textContent = a.q;
  $('#q-hint').textContent = a.hint;
  $('#q-opts').innerHTML = a.opts.map((o,i)=>
    '<div class="opt' + (draft[qi]===i+1 ? ' pick':'') + '" data-i="'+(i+1)+'">' +
    '<div class="t">'+o[0]+'</div>' + (o[1] ? '<div class="d">'+o[1]+'</div>' : '') + '</div>').join('');
  $('#q-opts').querySelectorAll('.opt').forEach(el => el.onclick = () => {
    draft[qi] = +el.dataset.i; haptic(); renderQ();
  });
  $('#q-next').disabled = !draft[qi];
  $('#q-next').textContent = qi === 5 ? (S.editing ? 'Сохранить' : 'В игру') : 'Дальше';
  $('#q-back').style.display = qi ? 'block' : 'none';
  window.scrollTo(0,0);
}
$('#q-next').onclick = async () => {
  if (qi < 5){ qi++; renderQ(); return; }
  $('#q-next').disabled = true; $('#q-next').textContent = 'Сохраняем…';
  try {
    await api('answers', { event:S.event.code, answers:draft.join('') });
    S.answers = draft.slice(); haptic('ok');
    await refresh(); show('#s-ticket');
    toast(S.editing ? 'Ответы обновлены' : 'Ты в игре');
    S.editing = false;
  } catch(e){ toast('Не сохранилось: ' + e.message); $('#q-next').disabled = false; renderQ(); }
};
$('#q-back').onclick = () => { qi--; renderQ(); };

/* ─── билет ─── */
function payload(){ return 'SL1|'+S.user.uid+'|'+(S.user.nick||'-')+'|'+S.answers.join(''); }

function drawTicket(){
  $('#t-event').textContent = S.event.title || 'Игра';
  $('#t-serial').textContent = '№ ' + String(S.state.serial||0).padStart(4,'0');
  $('#t-qr').innerHTML = QR.svg(payload(), { dark:'#060D0A', light:'#E9F3EC', quiet:2 });
  $('#t-cells').innerHTML = AXES.map((a,i)=>
    '<div class="cell"><div class="ic">'+a.ic+'</div><div class="vl">' +
    (a.opts[S.answers[i]-1]?.[0] || '—') + '</div></div>').join('');

  const st = S.state, hall = $('#t-hall');
  if (!st.ready){
    hall.innerHTML = '<div class="eyebrow">В зале</div>' +
      '<div class="hall-top"><div class="big">'+st.count+'</div></div>' +
      '<div class="waiting">Гости ещё собираются.<br>Пришлём, когда зал наполнится — тогда покажем твой расклад.</div>';
  } else {
    const d = st.dist || {}, max = st.myMax || 0;
    const rows = [6,5,4,3,2,1].map(n => {
      const c = d[n] || 0, w = st.count ? Math.max(c ? 5 : 0, c / st.count * 100) : 0;
      return '<div class="bar'+(n===6?' jack':'')+(c?'':' zero')+'">' +
        '<span class="lb">'+n+' из 6</span><div class="tr"><i class="fl" style="width:'+w+'%"></i></div>' +
        '<span class="ct">'+c+'</span></div>';
    }).join('');
    hall.innerHTML =
      '<div class="hall-top"><div><div class="eyebrow">В зале</div><div class="big">'+st.count+'</div></div>' +
      '<div style="text-align:right"><div class="eyebrow">Твой максимум</div>' +
      '<div class="big'+(max===6?' gold':'')+'">'+max+'</div></div></div>' +
      '<div class="hall-sub">'+(max===6 ? 'Джекпот в зале. Найди его.' : 'человек и лучшее совпадение')+'</div>' +
      '<div class="bars">'+rows+'</div>' +
      '<div class="note">Кто именно — узнаешь только сканом. Ники не показываем никому.</div>';
  }

  const done = st.scanned||0, tot = Math.max(st.count-1, 0);
  $('#h-txt').textContent = done + ' из ' + tot;
  $('#h-fill').style.width = (tot ? done/tot*100 : 0) + '%';
  $('#t-admin').style.display = S.admin ? 'block' : 'none';
}

$('#t-edit').onclick = () => { S.editing = true; qi = 0; draft = S.answers.slice(); renderQ(); show('#s-quiz'); };

/* ─── сканирование ─── */
function parse(txt){
  const p = String(txt||'').split('|');
  if (p[0] !== 'SL1' || p.length < 4) return null;
  const ans = p[3].trim();
  if (!/^[1-7]{6}$/.test(ans)) return null;
  return { uid:p[1], nick:p[2], answers:ans };
}

$('#t-scan').onclick = () => {
  if (!tg?.showScanQrPopup) return toast('Сканер доступен только внутри Telegram');
  tg.showScanQrPopup({ text:'Наведи на QR другого игрока' }, txt => {
    const t = parse(txt);
    if (!t) { toast('Это не билет лотереи'); return false; }
    if (t.uid === String(S.user.uid)) { toast('Это твой собственный билет'); return false; }
    tg.closeScanQrPopup();
    openResult(t);
    return true;
  });
};

function openResult(t){
  const mine = S.answers.join('');
  const hits = [];
  for (let i=0;i<6;i++) if (mine[i] === t.answers[i]) hits.push(i);
  const score = hits.length;
  haptic('ok');

  $('#r-score').textContent = score;
  $('#r-score').className = 'score' + (score===6 ? ' jackpot':'');
  $('#r-of').textContent = score===6 ? 'ДЖЕКПОТ' : 'ИЗ ШЕСТИ';
  $('#r-who').innerHTML = '@' + t.nick + '<small id="r-name"></small>';
  $('#r-axes').innerHTML = AXES.map((a,i)=>{
    const hit = hits.includes(i);
    return '<div class="ax'+(hit?' hit':'')+'"><span class="ic">'+a.ic+'</span>' +
      '<span class="tx">'+(hit ? a.gain : a.key + ' — разошлись')+'</span>' +
      '<span class="mk'+(hit?'':' no')+'">'+(hit?'✓':'—')+'</span></div>';
  }).join('');
  $('#r-write').style.display = (t.nick && t.nick !== '-') ? 'block' : 'none';
  $('#r-write').onclick = () => tg.openTelegramLink('https://t.me/' + t.nick);
  $('#s-res').classList.add('on');

  const item = { event:S.event.code, target:t.uid, score, answers:t.answers };
  api('scan', item)
    .then(r => { if (r.name) $('#r-name').textContent = r.name; refresh(); })
    .catch(() => { Q.add(item); $('#r-name').textContent = 'записано, отправим при связи'; });
}
$('#r-close').onclick = () => $('#s-res').classList.remove('on');
$('#r-more').onclick  = () => { $('#s-res').classList.remove('on'); $('#t-scan').click(); };

/* ─── админ ─── */
$('#t-admin').onclick = () => { show('#s-admin'); loadAdmin(); };
$('#a-back').onclick  = () => boot();
$('#a-create').onclick = async () => {
  const title = $('#a-title').value.trim();
  if (!title) return toast('Впиши название игры');
  try {
    await api('admin_create', { title, date: $('#a-date').value });
    $('#a-title').value = ''; toast('Игра создана'); loadAdmin();
  } catch(e){ toast(e.message); }
};

async function loadAdmin(){
  $('#a-body').innerHTML = '<div class="waiting">Загружаем…</div>';
  try {
    const d = await api('admin_stats', { event: S.event?.code });
    const link = 'https://t.me/' + BOT + '/app?startapp=' + d.event.code;
    const board = BOARD_URL + '?e=' + d.event.code;
    $('#a-body').innerHTML =
      '<h2>Плакат на вход</h2>' +
      '<div class="poster"><div class="pt">СОЦИАЛЬНАЯ ЛОТЕРЕЯ</div>' +
      '<div class="ps">СНИМИ КАМЕРОЙ ТЕЛЕФОНА</div>' +
      '<div class="pq">' + QR.svg(link, { dark:'#0A0A0A', light:'#FFFFFF', quiet:2 }) + '</div>' +
      '<div class="pc">' + d.event.code.toUpperCase() + '</div>' +
      '<div class="pf">Камера не открыла — зайди в @' + BOT + '<br>и введи код вручную</div></div>' +
      '<button class="btn ghost" id="a-print">Открыть плакат для печати</button>' +

      '<h2>' + (d.event.title||'Игра') + ' — сейчас</h2>' +
      '<div class="kv"><span>Зарегистрировано</span><b>' + d.count + '</b></div>' +
      '<div class="kv"><span>Сканов сделано</span><b>' + d.scans + '</b></div>' +
      '<div class="kv"><span>Пар 4+</span><b>' + d.pairs.length + '</b></div>' +
      '<div class="kv"><span>Джекпотов 6/6</span><b>' + d.jackpots + '</b></div>' +
      '<div class="kv"><span>Табло</span><b style="font-size:11px">открыто</b></div>' +

      '<h2>Лист для церемонии</h2>' +
      (d.pairs.length
        ? '<div class="pairs">' + d.pairs.map(p =>
            '<div><i>'+p.score+'/6</i> &nbsp;@'+p.a+' × @'+p.b+'</div>').join('') + '</div>'
        : '<div class="note">Пар 4+ пока нет. Появятся по ходу вечера.</div>') +

      '<h2>Общая база</h2>' +
      '<div class="kv"><span>Игроков всего</span><b>' + d.totalUsers + '</b></div>' +
      '<div class="kv"><span>Игр проведено</span><b>' + d.totalEvents + '</b></div>' +
      '<div class="kv"><span>Сканов за всё время</span><b>' + d.totalScans + '</b></div>' +

      '<h2>Ссылки</h2>' +
      '<div class="note" style="word-break:break-all">Вход: ' + link + '<br><br>Табло: ' + board + '</div>' +
      '<button class="btn ghost" id="a-board" style="margin-top:10px">Открыть табло</button>' +
      '<button class="btn ghost" id="a-close" style="margin-top:8px">Закрыть регистрацию</button>';

    $('#a-print').onclick = () => printPoster(d.event, link);
    $('#a-board').onclick = () => tg.openLink(board);
    $('#a-close').onclick = async () => {
      if (!confirm('Закрыть регистрацию на «'+(d.event.title||'игру')+'»? Новые гости не смогут войти.')) return;
      try { await api('admin_close', { event:d.event.code }); toast('Регистрация закрыта'); loadAdmin(); }
      catch(e){ toast(e.message); }
    };
  } catch(e){
    $('#a-body').innerHTML = /Нет открытой игры/.test(e.message)
      ? '<div class="waiting">Открытых игр пока нет.<br>Впиши название выше и нажми «Создать игру» —<br>' +
        'сразу получишь плакат с QR для печати.</div>'
      : '<div class="waiting">' + e.message + '</div>';
  }
}

function printPoster(ev, link){
  const w = window.open('', '_blank');
  if (!w) return toast('Разреши всплывающие окна, чтобы напечатать');
  w.document.write('<!DOCTYPE html><meta charset="utf-8"><title>Плакат</title>' +
    '<style>@page{size:A4;margin:0}body{margin:0;height:100vh;display:flex;flex-direction:column;' +
    'align-items:center;justify-content:center;font-family:system-ui,sans-serif;text-align:center;gap:6mm}' +
    'h1{font-size:34pt;margin:0;letter-spacing:-.5pt}p{margin:0;font-size:13pt;color:#444}' +
    '.q{width:110mm}.c{font-family:monospace;font-size:26pt;letter-spacing:8pt;font-weight:700}</style>' +
    '<h1>СОЦИАЛЬНАЯ ЛОТЕРЕЯ</h1><p>' + (ev.title||'') + '</p>' +
    '<div class="q">' + QR.svg(link, { dark:'#000', light:'#fff', quiet:2 }) + '</div>' +
    '<p><b>Сними этот код камерой телефона</b></p>' +
    '<div class="c">' + ev.code.toUpperCase() + '</div>' +
    '<p>Камера не сработала — открой @' + BOT + ' и введи код</p>');
  w.document.close();
  setTimeout(()=>w.print(), 400);
}

/* ─── обновление ─── */
async function refresh(strict){
  try {
    const st = await api('state', { event: S.event.code });
    S.state = st; drawTicket();
  } catch(e){
    if (strict) throw e;          // на первом открытии ошибку надо показать
    /* дальше без связи — оставляем прошлое состояние на экране */
  }
}

/* ─── старт ─── */
if (tg){ tg.ready(); tg.expand(); tg.setHeaderColor?.('#060D0A'); tg.setBackgroundColor?.('#060D0A');
         tg.disableVerticalSwipes?.(); }

async function boot(){
  show('#s-load');
  $('#s-load').innerHTML = '<div class="waiting" style="padding-top:44vh">Открываем лотерею…</div>';
  try {
    const code = (tg?.initDataUnsafe?.start_param || new URLSearchParams(location.search).get('e') || '').trim();
    const d = await api('me', { event: code });

    S.user = d.user; S.admin = !!d.admin;

    if (!d.event){
      $('#s-load').innerHTML = '<div class="waiting" style="padding-top:' + (S.admin ? '24' : '34') + 'vh">' +
        'Сейчас нет открытой игры.<br><br>Отсканируй код со стойки на входе<br>или дождись начала вечера.</div>' +
        (S.admin ? '<div class="sticky"><button class="btn" id="l-admin">Создать игру</button></div>' : '');
      if (S.admin) $('#l-admin').onclick = () => { show('#s-admin'); loadAdmin(); };
      return;
    }
    S.event = d.event;
    S.answers = d.answers ? d.answers.split('').map(Number) : [];

    if (!d.answers){ qi = 0; draft = []; renderQ(); show('#s-quiz'); return; }

    // постоянный гость подтверждает ответы каждую игру
    if (!d.confirmed){
      qi = 0; draft = S.answers.slice(); S.editing = true; renderQ(); show('#s-quiz');
      toast('Твои ответы с прошлой игры. Пролистай и подтверди', 4200);
      return;
    }
    await refresh(true); show('#s-ticket'); Q.flush();
  } catch(e){
    const box = $('#s-load');
    box.innerHTML = '<div class="waiting" style="padding-top:22vh">Не получилось открыть.<br><br>' +
      e.message + '</div>';
    if (/одпис/i.test(e.message)) showDiag(box);
  }
}
boot();

/* когда подпись не сошлась — показываем, что именно не так */
async function showDiag(box){
  box.insertAdjacentHTML('beforeend', '<div class="waiting" id="dg">Проверяем настройку…</div>');
  try {
    const r = await fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'diag', initData: tg?.initData || '' }) }).then(x=>x.json());

    const lines = [];
    if (!r.hasToken)             lines.push('❌ BOT_TOKEN не задан в свойствах скрипта');
    else if (!r.tokenLooksValid) lines.push('❌ BOT_TOKEN не похож на токен — проверь, нет ли лишних пробелов');
    else if (r.tokenError)       lines.push('❌ Telegram отклонил токен: ' + r.tokenError);
    else if (r.botUsername)      lines.push('Токен принадлежит боту <b style="color:var(--mint)">@' +
                                    r.botUsername + '</b> — открыт ли мини-апп именно у него?');
    if (r.matched === 'ни одна') lines.push('Подпись не сошлась ни в одном варианте — токен от другого бота.');
    else if (r.matched)          lines.push('✅ Подпись сходится (' + r.matched + '). Разверни новую версию скрипта.');
    if (r.fields)                lines.push('<span style="opacity:.6">Поля: ' + r.fields + '</span>');

    $('#dg').innerHTML = lines.join('<br><br>') || 'Диагностика ничего не вернула.';
  } catch(err){
    $('#dg').textContent = 'Не дозвонились до сервера: ' + err.message;
  }
}

setInterval(() => { if ($('#s-ticket').classList.contains('on')){ refresh(); Q.flush(); } }, 20000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && $('#s-ticket').classList.contains('on')){ refresh(); Q.flush(); }
});
</script>
